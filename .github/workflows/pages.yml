name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          test -f index.html || (echo "index.html missing" && exit 1)
          # No Windows Zone.Identifier markers may be committed
          if find . -path ./.git -prune -o -name '*Zone.Identifier*' -print | grep -q .; then
            echo "Zone.Identifier files found" && exit 1
          fi
          # JS syntax check (no dependencies, classic scripts)
          for f in js/*.js tests/*.js; do node --check "$f" || exit 1; done
          # JSON examples must parse
          for f in examples/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
          echo "validation OK"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
